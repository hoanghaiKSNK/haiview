# Builds HaiView for macOS and Windows on every push and pull request.
# Pushing a version tag (for example v0.3.0) also creates a GitHub Release with the zip files.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        run: ./macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and package
        shell: pwsh
        run: |
          [xml]$proj = Get-Content windows/HaiView/HaiView.csproj
          $version = $proj.Project.PropertyGroup.Version
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish windows/HaiView/HaiView.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -o "windows/build/$rid"
            $arch = $rid.Substring(4)
            Compress-Archive -Path "windows/build/$rid/HaiView.exe" -DestinationPath "dist/HaiView-$version-Windows-$arch.zip" -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Download
          - **Mac:** `HaiView-*-macOS.zip` (Apple silicon and Intel, macOS 15 or later)
          - **Windows:** `HaiView-*-Windows-x64.zip` for most PCs, `-arm64` for Windows on ARM

          First launch: on Mac right-click the app and choose **Open**; on Windows click **More info → Run anyway**.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*.zip
